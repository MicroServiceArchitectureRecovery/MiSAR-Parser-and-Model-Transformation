  site_name: MiSAR Documentation
  site_description: Documentation for the MiSAR parser, QVTo setup, and recovery workflow

  theme:
    name: material
    features:
      - navigation.instant
      - navigation.sections
      - navigation.top
      - search.highlight
      - search.suggest
      - content.code.copy
    palette:
      - scheme: default
        primary: indigo
        accent: indigo

  repo_url: https://github.com/MicroServiceArchitectureRecovery/misar
  repo_name: MiSAR GitHub

  nav:
    - Welcome: index.md
    - Changelog: changelog.md
    - MISAR Installation: installation.md
    - Create PSM: create-psm.md
    - QVT Plugin Installation: qvt-manual-installation.md
    - QVT Setup: qvt-setup.md
    - Create PIM: create-pim.md
    - Graphical Model Generator: graphical-generator.md
    - Uninstallation: uninstallation.md

  markdown_extensions:
    - admonition
    - toc:
        permalink: true
    - pymdownx.highlight
    - pymdownx.superfences
    - attr_list

  extra_css:
    - assets/css/style.css

  plugins:
    - search